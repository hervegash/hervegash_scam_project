<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101828, #1d2939);
            font-family: Arial, sans-serif;
        }

        .message-box {
            background: white;
            padding: 50px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #101828;
        }

        p {
            font-size: 24px;
            color: #344054;
        }
    </style>
</head>

<body>

    <div class="message-box">
        <h1>Welcome</h1>

        <p>
            I'm hervegash and it was good to be you
        </p>
    </div>

</body>
</html>
